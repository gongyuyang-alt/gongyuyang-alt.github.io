# Publications shown on the homepage. Add new papers at the top.
#
#   selected: true   -> shown under "Publications" as a paper box with a key figure
#   selected: false  -> listed compactly under "Other Publications"
#   image            -> file name inside images/papers/ (a key figure taken from the paper;
#                       PNG/JPG about 1200px wide, close to 16:9 looks best)
#   badge            -> short venue label printed on the figure, e.g. "CCS '26", "Preprint"
#   venue_short      -> bold venue name in the paper box, e.g. "ACM CCS 2025" (falls back to venue)
#   rank             -> printed after the venue in brackets, e.g. "CCF-A, Big4"
#   acceptance       -> acceptance rate shown in red, e.g. "14.5%" (cite the year's own statistics)
#   links            -> list of {label, url}, rendered as "arXiv / Code / DOI"
#   paper_url        -> where the title links to
#   to_appear: true  -> adds "(to appear)" after the venue
#
# Keep the English name "Yuyang Gong" in `authors`; the site bolds it automatically.
# Use <sup>&#42;</sup> after a name to mark equal contribution.

